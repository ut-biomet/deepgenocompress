[project]
name = "deepcgp"
version = "0.1.0"
description = "A Convolutional Neural Network to Predict Genotypic Values from Compressed Genome-Wide Polymorphisms"
readme = "README.md"
authors = [
    { name = "Tanzila Islam", email = "tanzilamohita@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.21.0",
]

[dependency-groups]
dev = [
  {include-group = "dev-no-exec"},
  {include-group = "lint_lsp_formatter"},
]
dev-no-exec = [
  # group without executable (eg. ruff): NixOS cannot run dynamically linked executables
  {include-group = "test"},
  {include-group = "doc"},
  "types-tensorflow>=2.18.0.20260402",
]

test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
]

lint_lsp_formatter = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "ruff>=0.14.6",
    "docformatter>=1.7.8",
]
doc = [
    "sphinx>=9.0.4",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "jupyter-sphinx>=0.5.3",
    "sphinx-book-theme>=1.2.0",
    "sphinx-autodoc-typehints>=3.6.1",
    "quarto>=0.1.0",
    "myst-parser>=5.1.0",
]


[tool.pytest.ini_options]
filterwarnings = [
    "error"
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s | %(levelname)-8s | %(name)s - %(message)s"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
exclude = ["source_material"]

[tool.ruff.lint]
extend-select = [
  "C4",  # flake8-comprehensions cf. https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "DJ",  # flake8-django cf. https://docs.astral.sh/ruff/rules/#flake8-django-dj
  "N",   # pep8-naming cf. https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "S",   # flake8-bandit  cf. https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "SIM", # flake8-simplify cf. https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "UP",  # pyupgrade cf. https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "E",   # pycodestyle error cf. https://docs.astral.sh/ruff/rules/#error-e
  "W",   # pycodestyle warnings cf. https://docs.astral.sh/ruff/rules/#warning-w
  "DOC", # pydoclint cf. https://docs.astral.sh/ruff/rules/#pydoclint-doc
  "D",   # pydocstyle cf. https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "RET", # flake8-return-ret https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "SLF", # flake8-self-slf (private member access) https://docs.astral.sh/ruff/rules/#flake8-self-slf
  "T20", # flake8-print (no print statement) https://docs.astral.sh/ruff/rules/#flake8-print-t20
  "ARG", # flake8-unused-arguments https://docs.astral.sh/ruff/rules/#flake8-unused-arguments-arg
  "ERA", # commented code https://docs.astral.sh/ruff/rules/#eradicate-era
  "B",   # flake8-bugbear https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "RUF", # Ruff-specific https://docs.astral.sh/ruff/rules/#refurb-furb
  "TID251",  # flake8-tidy-imports: banned-api
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"warnings.warn".msg = "Use deepcgp._base_warnings._deepcgp_warn() instead, to get the correct stacklevel automatically."

[tool.ruff.lint.per-file-ignores]
"tests/**/test_**.py" = [
  "D", # it is ok to not always have documentation for (small) tests
  "S101", # use of assert
  "N",   # to make test class name more permisive
  "SLF", # to test private member
]

"docs/**" = [
  "ERA",
]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
"typeCheckingMode" = "basic"
exclude = ["source_material", "**/__pycache__", "**/.*"]

[tool.docformatter]
black = true
