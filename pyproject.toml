[project]
name = "deepgenocompress"
version = "0.1.0"
description = "An AI-Driven Tool for Compressing Genome-Wide Polymorphisms in Plant Breeding"
readme = "README.md"
authors = [
    { name = "Tanzila Islam", email = "tanzilamohita@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cyvcf2>=0.34.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "keras>=2.21.0",
]

[project.optional-dependencies]
# the keras backends
tensorflow = ["tensorflow>=2.21.0"]
torch = ["torch>=2.14.0"]
jax = ["jax>=0.11.1"]

[tool.bumpversion]
current_version = "0.1.0"

[[tool.bumpversion.files]]
filename = "src/deepgenocompress/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "nix_pkgs/deepgenocompress.nix"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[dependency-groups]
dev = [
  {include-group = "dev-no-exec"},
  {include-group = "lint_lsp_formatter"},
]
dev-no-exec = [
  # group without executable (eg. ruff): NixOS cannot run dynamically linked executables
  {include-group = "test"},
  {include-group = "doc"},
  "bump-my-version>=1.5.1",
  "types-tensorflow>=2.18.0.20260402",
]

test = [
    "pytest>=9.0.2",
    "pytest-lazy-fixtures>=1.4.0",
    "pytest-mock>=3.15.1",
    "tensorflow>=2.21.0", # we need at least one keras backend
]

lint_lsp_formatter = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "ruff>=0.14.6",
]
doc = [
    "sphinx>=9.0.4",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "jupyter-sphinx>=0.5.3",
    "sphinx-book-theme>=1.2.0",
    "sphinx-autodoc-typehints>=3.6.1",
    "quarto>=0.1.0",
    "myst-parser>=5.1.0",
]


[tool.pytest.ini_options]
markers = [
    "upstream_watch: tests that track upstream library bugs; excluded by default",
]
addopts = "-m 'not upstream_watch'"

filterwarnings = [
    "error"
]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s | %(levelname)-8s | %(name)s - %(message)s"


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
exclude = ["source_material"]

[tool.ruff.lint]
extend-select = [
  "C4",  # flake8-comprehensions cf. https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "DJ",  # flake8-django cf. https://docs.astral.sh/ruff/rules/#flake8-django-dj
  "N",   # pep8-naming cf. https://docs.astral.sh/ruff/rules/#pep8-naming-n
  "S",   # flake8-bandit  cf. https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "SIM", # flake8-simplify cf. https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "UP",  # pyupgrade cf. https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "E",   # pycodestyle error cf. https://docs.astral.sh/ruff/rules/#error-e
  "W",   # pycodestyle warnings cf. https://docs.astral.sh/ruff/rules/#warning-w
  "DOC", # pydoclint cf. https://docs.astral.sh/ruff/rules/#pydoclint-doc
  "D",   # pydocstyle cf. https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "RET", # flake8-return-ret https://docs.astral.sh/ruff/rules/#flake8-return-ret
  "SLF", # flake8-self-slf (private member access) https://docs.astral.sh/ruff/rules/#flake8-self-slf
  "T20", # flake8-print (no print statement) https://docs.astral.sh/ruff/rules/#flake8-print-t20
  "ARG", # flake8-unused-arguments https://docs.astral.sh/ruff/rules/#flake8-unused-arguments-arg
  "ERA", # commented code https://docs.astral.sh/ruff/rules/#eradicate-era
  "B",   # flake8-bugbear https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "RUF", # Ruff-specific https://docs.astral.sh/ruff/rules/#refurb-furb
  "TID251",  # flake8-tidy-imports: banned-api
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"warnings.warn".msg = "Use deepgenocompress._core.warnings._deepgc_warn() instead, to get the correct stacklevel automatically."

[tool.ruff.lint.per-file-ignores]
"tests/**/test_**.py" = [
  "D", # it is ok to not always have documentation for (small) tests
  "S101", # use of assert
  "N",   # to make test class name more permisive
  "SLF", # to test private member
]
"docs/**" = ["ERA"]
"{playground,scratch,sandbox}*.py" = ["D","DOC", "TID", "ARG", "T20", "F401", "TID251"]
"{playground,scratch,sandbox}*/**" = ["D","DOC", "TID", "ARG", "T20", "F401", "TID251"]

"extra_stubs/**" = ["ALL"]



[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
"typeCheckingMode" = "basic"
exclude = ["source_material", "**/__pycache__", "**/.*"]
stubPath = "extra_stubs"
